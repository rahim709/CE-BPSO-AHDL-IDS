extends: gas_pipeline.yaml
# Archive-free: no predictor bundle, historical labels or tuned coefficients.
data:
  processed: results/ua_amf_prediction_20261108/data
  normalization: minmax
training:
  device: cuda
  threads: 1
  class_weighting: balanced
  gradient_clip: 1.0
  prediction_epochs: [3, 10, 30]
runtime:
  vectorized: true
  resident: true
  cache_data: true
  cache_model: true
  defer_scalar_sync: true
  validation_epochs: [3, 10, 30]
search:
  method: ua_amf_bpso
  promotion_policy: online
  population: 6
  generations: 100000
  min_epochs: 3
  epochs: 30
  budgets: [3, 10, 30]
  stop_f1: 0.6
  online:
    mode: full
    min_fit: 6
    min_calibration: 4
    min_checks: 4
    max_mae: 0.08
    max_width: 0.3
    check_window: 20
compute:
  max_epochs: 1000000
  max_seconds: 50
  max_gpu_seconds: 20
  gpu_budget_mode: execution
comparison:
  final_train: false
