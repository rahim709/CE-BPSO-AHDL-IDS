# Paper-informed search settings; data-schema and split choices are NOT paper facts.
seed: 42
space: paper
final_epochs: 200
final_seed: 10042
data:
  name: gas_pipeline
  files: [datasets/raw/gas_pipeline/gas_final.arff]
  target: result
  processed: datasets/processed/gas_pipeline
  normal_label: '0'
  normalization: column_l2
  split: stratified
  split_seed: 1729
  test_fraction: 0.2
  validation_fraction: 0.2
  # Official author-linked gas_final.arff: 26 raw predictors and eight-class result.
  # This allowlist is the release schema; the paper does not enumerate its features.
  features: [command_address, response_address, command_memory, response_memory,
    command_memory_count, response_memory_count, comm_read_function, comm_write_fun,
    resp_read_fun, resp_write_fun, sub_function, command_length, resp_length, gain,
    reset, deadband, cycletime, rate, setpoint, control_mode, control_scheme, pump,
    solenoid, crc_rate, measurement, time]
  drop_columns: [binary result, specific result, class]
training:
  device: auto
  threads: 1
  l1: 0.00001
  l2: 0.00001
  prediction_epochs: [3, 10, 30, 200]
search:
  method: bpso
  population: 20
  generations: 30
  epochs: 30
  min_epochs: 3
  eta: 3
  w_max: 0.8
  w_min: 0.4
  v_max: 10.0
  v_min: -10.0
  c1: 1.5
  c2: 1.5
  candidates: 600
  brackets: 100
compute:
  max_epochs: 18000
  # Omit max_seconds for equal-resource; omit max_epochs for equal-time.
diagnostics:
  candidates: 25
  cohort_seed: 1729
  seeds: [42, 43, 44]
  epochs: [3, 10, 30]
  long_epochs: 200
  shortlist: 5
  audit_rejected: 5
  top_k: 5
comparison:
  seeds: [42, 43, 44]
  methods: [bpso, bpso_reduced, bpso_sh, hyperband, dehb, random, surrogate]
  final_train: true
# Fig.15; regularization coefficient, head, reshape and pool operator are decisions.
architecture:
  batch_size: 1024
  optimizer: adamax
  learning_rate: 0.01
  cnn:
    - {padding: same, filters: 384, kernel: 2, pool: 4, activation: relu}
  rnn:
    - {kind: gru, units: 256, activation: relu, regularization: l1_l2, dropout: 0.2}
